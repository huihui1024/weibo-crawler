<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微博博主内容抓取</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #43a047;
            --secondary-color: #2e7d32;
            --bg-color: #e8f5e9;
            --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        body {
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 2px 10px rgba(67,160,71,0.3);
        }
        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }
        .card-header {
            background: #fff;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            padding: 16px 20px;
            border-radius: 12px 12px 0 0 !important;
        }
        .card-header .bi {
            margin-right: 8px;
            color: var(--primary-color);
        }
        .blogger-item {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #eee;
            transition: all 0.2s;
        }
        .blogger-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(67,160,71,0.15);
        }
        .blogger-item:last-child {
            margin-bottom: 0;
        }
        .blogger-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .blogger-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 18px;
        }
        .blogger-details {
            flex: 1;
            min-width: 200px;
        }
        .blogger-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        .blogger-uid {
            color: #888;
            font-size: 13px;
        }
        .blogger-stats {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .stat-label {
            font-size: 12px;
            color: #888;
        }
        .blogger-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-action {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 6px;
        }
        .btn-crawl {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #fff;
        }
        .btn-crawl:hover {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
            color: #fff;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-enabled {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-disabled {
            background: #ffebee;
            color: #c62828;
        }
        .weibo-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #eee;
        }
        .weibo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .weibo-author {
            font-weight: 600;
            color: #333;
        }
        .weibo-time {
            color: #888;
            font-size: 13px;
        }
        .weibo-content {
            color: #333;
            line-height: 1.7;
            margin-bottom: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .weibo-content-wrapper {
            position: relative;
            margin-bottom: 12px;
        }
        .weibo-content-wrapper.collapsed .weibo-content {
            max-height: 100px;
            overflow: hidden;
        }
        .weibo-content-wrapper.expanded .weibo-content {
            max-height: none;
            overflow: visible;
        }
        .weibo-content-wrapper.collapsed .weibo-content::after {
            content: '';
            position: absolute;
            bottom: 25px;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(transparent, #fff);
            pointer-events: none;
        }
        .expand-btn {
            color: var(--primary-color);
            cursor: pointer;
            font-size: 13px;
            display: block;
            margin-top: 5px;
            position: relative;
            z-index: 1;
        }
        .expand-btn:hover {
            text-decoration: underline;
        }
        .weibo-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            margin-bottom: 12px;
        }
        .weibo-images img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .weibo-images img:hover {
            transform: scale(1.02);
        }
        .repost-box {
            background: #f1f8e9;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 3px solid var(--primary-color);
            margin-top: 12px;
        }
        .repost-author {
            color: var(--primary-color);
            font-weight: 500;
        }
        .pinned-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
        }
        .cookie-section {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            padding: 16px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 10px 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67,160,71,0.1);
        }
        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
            padding: 10px 20px;
        }
        .btn-primary:hover {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
        }
        .btn-outline-primary:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-outline-secondary {
            border-radius: 8px;
        }
        .btn-outline-danger {
            border-radius: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        .empty-state i {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 16px;
        }
        .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
        }
        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .select-blogger {
            cursor: pointer;
            transition: all 0.2s;
        }
        .select-blogger.active {
            border-color: var(--primary-color);
            background: #e8f5e9;
        }
        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }
        .tab-btn:hover:not(.active) {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        /* 博主列样式 */
        .blogger-column {
            height: 600px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 10px;
            background: #fff;
        }
        .blogger-column-header {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            padding: 12px 15px;
            border-radius: 10px 10px 0 0;
            font-weight: 600;
            z-index: 10;
        }
        .blogger-column-content {
            padding: 10px;
        }
        .blogger-column .weibo-card {
            margin-bottom: 10px;
            padding: 12px;
        }
        .blogger-column .weibo-content {
            font-size: 13px;
            line-height: 1.6;
        }
        .blogger-column .weibo-images {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .blogger-column .weibo-images img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .blogger-column .weibo-images img:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .blogger-column .weibo-images.single-img {
            display: block;
        }
        .blogger-column .weibo-images.single-img img {
            width: 100%;
            max-width: 200px;
            height: auto;
            max-height: 200px;
        }
        .blogger-column .weibo-images.double-img {
            grid-template-columns: repeat(2, 1fr);
        }
        .blogger-column .weibo-images.double-img img {
            height: 100px;
        }
        .load-more-btn {
            width: 100%;
            margin-top: 10px;
            font-size: 12px;
        }
        /* 图片放大模态框 */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .image-modal.active {
            display: flex;
        }
        .image-modal .image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }
        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
            cursor: grab;
        }
        .image-modal img.zoomed {
            cursor: move;
        }
        .image-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .image-modal .close-btn:hover {
            transform: scale(1.2);
        }
        .image-modal .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #fff;
            font-size: 50px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .image-modal .nav-btn:hover {
            opacity: 1;
        }
        .image-modal .prev-btn {
            left: 20px;
        }
        .image-modal .next-btn {
            right: 20px;
        }
        .image-modal .img-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .image-modal .zoom-controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 25px;
        }
        .image-modal .zoom-controls button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .image-modal .zoom-controls button:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
        }
        .image-modal .zoom-controls .zoom-level {
            color: #fff;
            font-size: 14px;
            display: flex;
            align-items: center;
            min-width: 50px;
            justify-content: center;
        }
        .image-modal .zoom-controls .divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.3);
        }
        /* 全局错误提示 */
        .global-alert {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9998;
            min-width: 300px;
            max-width: 600px;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            display: none;
            animation: slideDown 0.3s ease;
        }
        .global-alert.show {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .global-alert.alert-error {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: #fff;
        }
        .global-alert.alert-warning {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
        }
        .global-alert.alert-success {
            background: linear-gradient(135deg, #4caf50, #388e3c);
            color: #fff;
        }
        .global-alert i {
            font-size: 24px;
        }
        .global-alert .alert-content {
            flex: 1;
        }
        .global-alert .alert-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .global-alert .alert-message {
            font-size: 13px;
            opacity: 0.9;
        }
        .global-alert .alert-actions {
            display: flex;
            gap: 8px;
        }
        .global-alert .btn-action {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .global-alert .btn-action:hover {
            background: rgba(255,255,255,0.3);
        }
        .global-alert .btn-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.7;
        }
        .global-alert .btn-close:hover {
            opacity: 1;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        /* 状态指示器 */
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-indicator.success {
            background: #4caf50;
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.5);
        }
        .status-indicator.error {
            background: #f44336;
            box-shadow: 0 0 6px rgba(244, 67, 54, 0.5);
        }
        .status-indicator.warning {
            background: #ff9800;
            box-shadow: 0 0 6px rgba(255, 152, 0, 0.5);
        }
        .status-indicator.pending {
            background: #9e9e9e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        #statusCard .card-body {
            font-size: 14px;
        }
        /* 分析卡片样式 - 完全按照参考格式 */
        .analysis-column {
            max-width: 480px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
            border: 1px solid #f0f0f0;
        }
        .analysis-column-header {
            background: linear-gradient(135deg, #43a047, #2e7d32);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px 12px 0 0;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .analysis-column-content {
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #333;
        }
        /* 顶部画像区 */
        .analysis-profile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f5f5f5;
        }
        .analysis-profile-left .profile-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        .analysis-profile-left .profile-value {
            font-size: 15px;
            font-weight: bold;
        }
        .analysis-profile-left .market-tag {
            color: #1890ff;
        }
        .analysis-profile-left .style-tag {
            background: #f6ffed;
            color: #52c41a;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            margin-left: 6px;
            border: 1px solid #b7eb8f;
        }
        .analysis-profile-right {
            text-align: right;
        }
        .analysis-profile-right .profile-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
        }
        .analysis-profile-right .profile-value {
            font-size: 13px;
            color: #999;
        }
        /* 选股体系权重条 - 紧凑版 */
        .selection-factors {
            margin-bottom: 12px;
        }
        .selection-factors .section-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #666;
        }
        .factor-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .factor-bar .factor-name {
            width: 45px;
            color: #666;
        }
        .factor-bar .bar-bg {
            flex: 1;
            background: #f0f0f0;
            height: 4px;
            border-radius: 2px;
        }
        .factor-bar .bar-fill {
            background: #1890ff;
            height: 100%;
            border-radius: 2px;
        }
        .factor-bar span:last-child {
            width: 30px;
            text-align: right;
            color: #999;
        }
        .selection-formula {
            background: #fffbe6;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #d48806;
            border: 1px solid #ffe58f;
            margin-top: 6px;
        }
        /* 交易体系双列 */
        .trading-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .trading-item {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
        }
        .trading-item .item-label {
            font-size: 11px;
            color: #999;
        }
        .trading-item .item-value {
            font-size: 13px;
            font-weight: bold;
            margin-top: 2px;
        }
        /* 避雷区 */
        .avoid-zone {
            font-size: 12px;
            color: #ff4d4f;
            background: #fff1f0;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ffccc7;
            margin-bottom: 12px;
        }
        /* 可能持仓个股 */
        .likely-positions {
            margin-bottom: 12px;
        }
        .likely-positions .section-label {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #555;
        }
        .position-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .position-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .position-item.high-confidence {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
        }
        .position-item.high-confidence .pos-name {
            color: #1890ff;
            font-weight: bold;
        }
        .position-item.medium-confidence {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
        }
        .position-item.medium-confidence .pos-name {
            color: #52c41a;
        }
        .position-item.low-confidence {
            background: #fffbe6;
            border: 1px solid #ffe58f;
        }
        .position-item.low-confidence .pos-name {
            color: #d48806;
        }
        .position-item.bearish-item {
            background: #fff2f0;
            border: 1px solid #ffccc7;
        }
        .position-item.neutral-item {
            background: #fafafa;
            border: 1px solid #d9d9d9;
        }
        .pos-sector {
            font-size: 10px;
            color: #8c8c8c;
            background: #f5f5f5;
            padding: 1px 4px;
            border-radius: 2px;
        }
        .pos-signal {
            font-size: 10px;
            color: #cf1322;
            background: #fff1f0;
            padding: 1px 4px;
            border-radius: 2px;
        }
        .pos-score {
            font-size: 10px;
            color: #999;
        }

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">

    <!-- 全局错误提示 -->

    <div class="container py-4">

            <div class="card-body py-2">

                            <span class="status-indicator" id="cookieIndicator"></span>

                                <strong>Cookie状态：</strong>

                            </span>

                    <div class="col-md-4">

                <div id="errorDetail" class="mt-2" style="display: none;">

                </div>

        <!-- 博主管理区块 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-people-fill"></i>博主管理</span>
                <button class="btn btn-primary btn-sm" onclick="showAddModal()">
                    <i class="bi bi-plus-lg"></i> 添加博主
                </button>
            </div>
            <div class="card-body">
                <div id="bloggerList">

        <!-- 微博内容区块 - 按博主分列显示 -->

            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-file-text-fill"></i>采集内容（按博主分类）</span>
                <div class="d-flex gap-2">

                        <button class="btn btn-outline-secondary" type="button" onclick="searchWeibo()">
                            <i class="bi bi-search"></i>
                        </button>

    <!-- 添加博主模态框 -->
    <div class="modal fade" id="addModal" tabindex="-1">

            <div class="modal-content">

                    <h5 class="modal-title">添加博主</h5>

                <form id="addForm" onsubmit="addBlogger(event)">

                            <input type="text" class="form-control" name="uid" required placeholder="例如: 1669879400">

                        </div>
                        <div class="mb-3">
                            <label class="form-label">昵称</label>
                            <input type="text" class="form-control" name="nickname" placeholder="博主昵称（可选）">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">采集间隔（分钟）</label>
                            <input type="number" class="form-control" name="interval" value="60" min="1" max="1440">
                            <small class="text-muted">建议30分钟以上，避免被限制</small>

                        <div class="mb-3">
                            <div class="form-check">

    <!-- 编辑博主模态框 -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">编辑博主</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="editForm" onsubmit="updateBlogger(event)">
                    <input type="hidden" name="blogger_id" id="editBloggerId">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">昵称</label>
                            <input type="text" class="form-control" name="nickname" id="editNickname">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">采集间隔（分钟）</label>
                            <input type="number" class="form-control" name="interval" id="editInterval" min="1" max="1440">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="enabled" id="editEnabled">
                                <label class="form-check-label" for="editEnabled">启用定时采集</label>

    <!-- Cookie设置模态框 -->
    <div class="modal fade" id="cookieModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cookie设置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        <strong>获取Cookie方法：</strong>
                        <ol class="mb-0 mt-2">
                            <li>登录 <a href="https://m.weibo.cn" target="_blank">m.weibo.cn</a></li>
                            <li>按F12打开开发者工具</li>
                            <li>切换到 Network 标签</li>
                            <li>刷新页面，点击任意请求</li>
                            <li>在 Headers 中找到 Cookie 字段并复制</li>
                        </ol>
                        <div class="alert alert-warning mt-2 mb-0">
                            <i class="bi bi-exclamation-triangle"></i>
                            <strong>注意：</strong>微博API需要登录才能访问，请务必配置Cookie，否则无法采集数据！
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">微博Cookie</label>
                        <textarea class="form-control" id="cookieInput" rows="4" placeholder="粘贴Cookie内容..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">当前状态</label>
                        <div id="cookieStatus" class="text-muted">未设置</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger" onclick="clearCookie()">清除Cookie</button>
                    <button type="button" class="btn btn-primary" onclick="saveCookie()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片查看模态框 -->
    <div class="modal fade" id="imageModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-0">
                    <img src="" id="modalImage" class="img-fluid w-100" style="max-height: 80vh; object-fit: contain;">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentBloggerId = null;
        let currentPage = 1;
        let pageSize = 20;
        let hasMore = true;
        let lastApiError = null;

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            refreshStatus();
            loadBloggers();
        });

        // 刷新状态
        async function refreshStatus() {
            await checkCookieStatus();
        }

        // 更新Cookie状态显示
        function updateCookieStatus(hasCookie, isValid = null) {
            const indicator = document.getElementById('cookieIndicator');
            const statusText = document.getElementById('cookieStatusText');

            if (!hasCookie) {
                indicator.className = 'status-indicator error';
                statusText.textContent = '未设置';
                statusText.className = 'text-danger';
            } else if (isValid === false) {
                indicator.className = 'status-indicator error';
                statusText.textContent = '已过期';
                statusText.className = 'text-danger';
            } else if (isValid === true) {
                indicator.className = 'status-indicator success';
                statusText.textContent = '正常';
                statusText.className = 'text-success';
            } else {
                indicator.className = 'status-indicator success';
                statusText.textContent = '已设置';
                statusText.className = 'text-success';
            }
        }

        // 更新API状态显示
        function updateApiStatus(status, errorMsg = null) {
            const indicator = document.getElementById('apiIndicator');
            const statusText = document.getElementById('apiStatusText');
            const errorDetail = document.getElementById('errorDetail');
            const errorDetailText = document.getElementById('errorDetailText');
            const lastCheckTime = document.getElementById('lastCheckTime');

            const now = new Date();
            lastCheckTime.textContent = `最后检查: ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

            if (status === 'success') {
                indicator.className = 'status-indicator success';
                statusText.textContent = '一切正常';
                statusText.className = 'text-success';
                errorDetail.style.display = 'none';
                lastApiError = null;
            } else if (status === 'error') {
                indicator.className = 'status-indicator error';
                statusText.textContent = '请求失败';
                statusText.className = 'text-danger';
                if (errorMsg) {
                    lastApiError = errorMsg;
                    errorDetailText.textContent = errorMsg;
                    errorDetail.style.display = 'block';
                }
            } else if (status === 'pending') {
                indicator.className = 'status-indicator pending';
                statusText.textContent = '请求中...';
                statusText.className = 'text-muted';
            } else {
                indicator.className = 'status-indicator warning';
                statusText.textContent = '等待请求';
                statusText.className = 'text-muted';
            }
        }

        // 检查Cookie状态
        async function checkCookieStatus() {
            try {
                const response = await fetch('/api/cookie');
                const data = await response.json();
                updateCookieStatus(data.has_cookie, data.is_valid);

                if (!data.has_cookie) {
                    updateApiStatus('error', '未设置Cookie');
                    showGlobalAlert('warning', '未设置Cookie', '微博API需要登录才能访问，请先设置Cookie', [
                        { label: '设置Cookie', onclick: 'showCookieModal()' }
                    ], true);
                } else if (data.is_valid === false) {
                    updateApiStatus('error', 'Cookie已过期');
                    showGlobalAlert('warning', 'Cookie已过期', '微博Cookie已失效，请重新设置', [
                        { label: '重新设置', onclick: 'showCookieModal()' }
                    ], true);
                } else if (lastApiError) {
                    // Cookie已设置但有之前的错误
                    updateApiStatus('error', lastApiError);
                } else {
                    // Cookie已设置，状态正常
                    updateApiStatus('success');
                }
            } catch (error) {
                console.error('检查Cookie状态失败:', error);
                updateCookieStatus(false);
                updateApiStatus('error', '无法连接服务器');
            }
        }

        // 加载博主列表
        async function loadBloggers() {
            try {
                const response = await fetch('/api/bloggers');
                const data = await response.json();

                const listHtml = data.bloggers.length === 0 ?
                    '<div class="empty-state"><i class="bi bi-people"></i><p>暂无博主，点击上方按钮添加</p></div>' :
                    data.bloggers.map(item => `
                        <div class="blogger-item select-blogger ${currentBloggerId === item.blogger.id ? 'active' : ''}" onclick="selectBlogger(${item.blogger.id})">
                            <div class="blogger-info">
                                <div class="blogger-avatar">${(item.blogger.nickname || item.blogger.weibo_uid).charAt(0)}</div>
                                <div class="blogger-details">
                                    <div class="blogger-name">
                                        ${item.blogger.nickname || '未命名博主'}
                                        ${item.blogger.enabled ? '<span class="status-badge status-enabled">启用</span>' : '<span class="status-badge status-disabled">禁用</span>'}
                                    </div>
                                    <div class="blogger-uid">UID: ${item.blogger.weibo_uid}</div>
                                </div>
                                <div class="blogger-stats">
                                    <div class="stat-item">
                                        <div class="stat-value">${item.post_count}</div>
                                        <div class="stat-label">微博数</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value">${item.blogger.crawl_interval}</div>
                                        <div class="stat-label">间隔(分)</div>
                                    </div>
                                </div>
                                <div class="blogger-actions">
                                    <button class="btn btn-crawl btn-action" onclick="event.stopPropagation(); crawlOne(${item.blogger.id}, this)">
                                        <i class="bi bi-arrow-repeat"></i> 爬取
                                    </button>
                                    <button class="btn btn-outline-primary btn-action" onclick="event.stopPropagation(); showEditModal(${item.blogger.id}, '${item.blogger.nickname || ''}', ${item.blogger.crawl_interval}, ${item.blogger.enabled})">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-outline-danger btn-action" onclick="event.stopPropagation(); deleteBlogger(${item.blogger.id})">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="mt-2 text-muted small">
                                <span>下次爬取: ${item.next_run_time}</span>
                                <span class="ms-3">最后爬取: ${item.blogger.last_crawl_time || '未爬取'}</span>
                            </div>
                        </div>
                    `).join('');

                document.getElementById('bloggerList').innerHTML = listHtml;

                // 更新搜索博主下拉框
                updateSearchBloggerSelect(data.bloggers);

                // 加载各博主的微博列
                loadWeiboColumns(data.bloggers);
            } catch (error) {
                console.error('加载博主失败:', error);
            }
        }

        // 加载各博主的微博列
        async function loadWeiboColumns(bloggers) {
            const container = document.getElementById('weiboColumns');

            if (bloggers.length === 0) {
                container.innerHTML = '<div class="col-12"><div class="empty-state"><i class="bi bi-file-text"></i><p>暂无博主，请先添加博主</p></div></div>';
                return;
            }

            // 根据博主数量决定每行显示几个
            let colClass = 'col-md-6 col-lg-4'; // 默认每行3个
            if (bloggers.length === 1) {
                colClass = 'col-md-8 col-lg-6';
            } else if (bloggers.length === 2) {
                colClass = 'col-md-6';
            }

            // 创建各博主的列
            let columnsHtml = '';
            for (const item of bloggers) {
                const bloggerId = item.blogger.id;
                const bloggerName = item.blogger.nickname || item.blogger.weibo_uid;

                columnsHtml += `
                    <div class="${colClass} mb-4">
                        <div class="blogger-column" id="column-${bloggerId}">
                            <div class="blogger-column-header d-flex justify-content-between align-items-center">
                                <span>${bloggerName}</span>
                                <span class="badge bg-light text-dark">${item.post_count}条</span>
                            </div>
                            <div class="blogger-column-content" id="content-${bloggerId}">
                                <div class="text-center py-4">
                                    <div class="spinner-border spinner-border-sm text-primary" role="status">
                                        <span class="visually-hidden">加载中...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = columnsHtml;

            // 并行加载各博主的微博
            for (const item of bloggers) {
                loadBloggerPosts(item.blogger.id);
            }
        }

        // 加载单个博主的微博
        async function loadBloggerPosts(bloggerId, page = 1) {
            const contentEl = document.getElementById(`content-${bloggerId}`);
            const limit = 10;
            const offset = (page - 1) * limit;

            try {
                const response = await fetch(`/api/posts?blogger_id=${bloggerId}&limit=${limit}&offset=${offset}`);
                const data = await response.json();

                if (data.posts.length === 0) {
                    contentEl.innerHTML = '<div class="text-center text-muted py-4"><small>暂无微博数据</small></div>';
                    return;
                }

                let postsHtml = data.posts.map(item => {
                    const imgCount = item.images ? item.images.length : 0;
                    let imgClass = 'weibo-images';
                    if (imgCount === 1) imgClass += ' single-img';
                    else if (imgCount === 2) imgClass += ' double-img';

                    const imagesHtml = item.images && item.images.length > 0 ? `
                        <div class="${imgClass}" data-images='${JSON.stringify(item.images.map(img => `/images/${item.post.weibo_id}/${img.local_path.split('/').pop()}`))}'>
                            ${item.images.slice(0, 9).map((img, idx) => `<img src="/images/${item.post.weibo_id}/${img.local_path.split('/').pop()}" onclick="openImageModal(this)" data-index="${idx}" loading="lazy">`).join('')}
                            ${item.images.length > 9 ? `<span class="text-muted small" style="grid-column: span 3; text-align: center;">+${item.images.length - 9}张</span>` : ''}
                        </div>
                    ` : '';

                    // 处理内容长度，添加展开/收起功能
                    const content = item.post.content || '无内容';
                    const wrapperId = `wrapper-${item.post.weibo_id}`;
                    const needsExpand = content.length > 150;

                    return `
                        <div class="weibo-card">
                            <div class="weibo-header">
                                <div>
                                    ${item.post.is_pinned ? '<span class="pinned-badge">置顶</span>' : ''}

        // 搜索微博
        async function searchWeibo() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const bloggerId = document.getElementById('searchBlogger').value;

            if (!keyword) {
                // 如果关键词为空，重新加载正常内容
                loadBloggers();
                return;
            }

            // 显示搜索结果
            const weiboColumns = document.getElementById('weiboColumns');
            weiboColumns.innerHTML = `
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="mb-0"><i class="bi bi-search"></i> 搜索结果: "${keyword}"</h6>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearSearch()">
                            <i class="bi bi-x-lg"></i> 清除搜索
                        </button>
                    </div>
                    <div id="searchResults">
                        <div class="text-center py-4"><span class="loading"></span> 搜索中...</div>
                    </div>
                </div>
            `;

            try {
                const params = new URLSearchParams({ keyword, limit: 50 });
                if (bloggerId) params.append('blogger_id', bloggerId);

                const response = await fetch(`/api/search?${params}`);
                const data = await response.json();

                const resultsEl = document.getElementById('searchResults');

                if (data.posts.length === 0) {
                    resultsEl.innerHTML = '<div class="text-center text-muted py-4">未找到匹配的微博</div>';
                    return;
                }

                let postsHtml = data.posts.map(item => {
                    const imgCount = item.images ? item.images.length : 0;
                    let imgClass = 'weibo-images';
                    if (imgCount === 1) imgClass += ' single-img';
                    else if (imgCount === 2) imgClass += ' double-img';

                    const imagesHtml = item.images && item.images.length > 0 ? `
                        <div class="${imgClass}" data-images='${JSON.stringify(item.images.map(img => `/images/${item.post.weibo_id}/${img.local_path.split('/').pop()}`))}'>
                            ${item.images.slice(0, 9).map((img, idx) => `<img src="/images/${item.post.weibo_id}/${img.local_path.split('/').pop()}" onclick="openImageModal(this)" data-index="${idx}" loading="lazy">`).join('')}
                        </div>
                    ` : '';

                    const content = item.post.content || '无内容';
                    const wrapperId = `wrapper-${item.post.weibo_id}`;
                    const needsExpand = content.length > 150;

                    // 高亮关键词
                    const highlightedContent = highlightKeyword(content, keyword);

                    return `
                        <div class="weibo-card">
                            <div class="weibo-header">
                                <div>
                                    <span class="badge bg-secondary">${item.blogger_name}</span>
                                    ${item.post.is_pinned ? '<span class="pinned-badge">置顶</span>' : ''}
                                    ${item.post.is_repost ? '<span class="badge bg-info ms-1">转发</span>' : ''}
                                </div>
                                <span class="weibo-time">${formatTime(item.post.publish_time)}</span>
                            </div>
                            <div class="weibo-content-wrapper ${needsExpand ? 'collapsed' : ''}" id="${wrapperId}">
                                <div class="weibo-content">${highlightedContent}</div>
                                ${needsExpand ? `<span class="expand-btn" onclick="toggleExpand('${wrapperId}', event)">展开全文</span>` : ''}
                            </div>
                            ${imagesHtml}
                            ${item.post.is_repost && item.post.repost_content ? `
                                <div class="repost-box">
                                    <span class="repost-author">@${item.post.repost_author || '原作者'}:</span>
                                    <div class="weibo-content mb-0">${highlightKeyword(item.post.repost_content, keyword)}</div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

                resultsEl.innerHTML = `
                    <div class="mb-2 text-muted small">找到 ${data.total} 条匹配的微博</div>
                    ${postsHtml}
                `;

            } catch (error) {
                console.error('搜索失败:', error);
                document.getElementById('searchResults').innerHTML = '<div class="alert alert-danger">搜索失败</div>';
            }
        }

        // 高亮关键词
        function highlightKeyword(text, keyword) {
            if (!keyword || !text) return text;
            const regex = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        // 格式化时间 - 显示完整北京时间
        function formatTime(timeStr) {
            if (!timeStr) return '未知时间';
            try {
                const date = new Date(timeStr);
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                const h = String(date.getHours()).padStart(2, '0');
                const min = String(date.getMinutes()).padStart(2, '0');
                const s = String(date.getSeconds()).padStart(2, '0');
                return `${y}-${m}-${d} ${h}:${min}:${s}`;
            } catch {
                return timeStr;
            }
        }

        // 全局错误提示相关
        let alertTimeout = null;

        function showGlobalAlert(type, title, message, actions = null, persistent = false) {
            const alert = document.getElementById('globalAlert');
            const icon = document.getElementById('alertIcon');
            const titleEl = document.getElementById('alertTitle');
            const messageEl = document.getElementById('alertMessage');
            const actionsEl = document.getElementById('alertActions');

            // 清除之前的定时器
            if (alertTimeout) {
                clearTimeout(alertTimeout);
                alertTimeout = null;
            }

            // 设置类型
            alert.className = `global-alert show alert-${type}`;

            // 设置图标
            const icons = {
                'error': 'bi-x-circle-fill',
                'warning': 'bi-exclamation-triangle-fill',
                'success': 'bi-check-circle-fill'
            };
            icon.className = `bi ${icons[type] || icons['warning']}`;

            // 设置内容
            titleEl.textContent = title;
            messageEl.textContent = message;

            // 设置操作按钮
            if (actions && actions.length > 0) {
                actionsEl.innerHTML = actions.map(action =>
                    `<button class="btn-action" onclick="${action.onclick}">${action.label}</button>`
                ).join('');
                actionsEl.style.display = 'flex';
            } else {
                actionsEl.style.display = 'none';
            }

            // 非持久性提示自动消失
            if (!persistent) {
                alertTimeout = setTimeout(() => {
                    hideGlobalAlert();
                }, 10000);
            }
        }

        function hideGlobalAlert() {
            const alert = document.getElementById('globalAlert');
            alert.classList.remove('show');
            if (alertTimeout) {
                clearTimeout(alertTimeout);
                alertTimeout = null;
            }
        }

        // 爬取单个博主
        async function crawlOne(id, btn) {
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> 爬取中';
            btn.disabled = true;

            // 更新状态为请求中
            updateApiStatus('pending');

            // 获取博主名称
            const bloggerItem = btn.closest('.blogger-item');
            const bloggerName = bloggerItem ? bloggerItem.querySelector('.blogger-name').textContent.split('\n')[0].trim() : `博主${id}`;

            try {
                const response = await fetch(`/crawl/${id}`, { method: 'POST' });
                const data = await response.json();

                if (response.ok && data.success) {
                    updateApiStatus('success');
                    updateCookieStatus(true, true);
                    showGlobalAlert('success', '爬取成功', `新增 ${data.new_count} 条微博`);
                    loadBloggers();
                } else {
                    // 检查是否是Cookie错误
                    let errorMsg = data.detail || data.msg || '未知错误';
                    // 如果errorMsg是对象，转为字符串
                    if (typeof errorMsg === 'object') {
                        errorMsg = JSON.stringify(errorMsg);
                    }
                    lastApiError = errorMsg;
                    updateApiStatus('error', errorMsg);

                    if (errorMsg.includes('Cookie') || errorMsg.includes('登录') || errorMsg.includes('过期') || errorMsg.includes('432')) {
                        updateCookieStatus(true, false);
                        showGlobalAlert('error', 'Cookie无效或已过期', '请重新设置微博Cookie', [
                            { label: '设置Cookie', onclick: 'showCookieModal()' }
                        ], true);
                    } else {
                        showGlobalAlert('error', '爬取失败', errorMsg);
                    }
                }
            } catch (error) {
                lastApiError = error.toString();
                updateApiStatus('error', error.toString());
                showGlobalAlert('error', '爬取失败', error.toString());
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // 爬取全部
        async function crawlAll() {
            if (!confirm('确定爬取所有启用的博主？')) return;

            updateApiStatus('pending');
            showGlobalAlert('warning', '正在爬取', '请稍候...', null, true);

            try {
                const response = await fetch('/crawl/all', { method: 'POST' });
                const data = await response.json();

                if (response.ok && data.success) {
                    // 检查是否有失败的博主
                    const failed = Object.entries(data.results || {}).filter(([_, r]) => !r.success);
                    if (failed.length > 0) {
                        const failedMsg = failed.map(([uid, r]) => `${uid}: ${r.error}`).join('; ');
                        lastApiError = failedMsg;
                        updateApiStatus('error', failedMsg);

                        if (failedMsg.includes('Cookie') || failedMsg.includes('登录') || failedMsg.includes('过期')) {
                            updateCookieStatus(true, false);
                            showGlobalAlert('error', '部分博主爬取失败', 'Cookie可能已过期，请重新设置', [
                                { label: '设置Cookie', onclick: 'showCookieModal()' }
                            ], true);
                        } else {
                            showGlobalAlert('warning', '部分博主爬取失败', failedMsg);
                        }
                    } else {
                        updateApiStatus('success');
                        updateCookieStatus(true, true);
                        const totalNew = Object.values(data.results || {}).reduce((sum, r) => sum + (r.new_count || 0), 0);
                        showGlobalAlert('success', '全部爬取完成', `共新增 ${totalNew} 条微博`);
                    }

                    // 重新加载博主列表
                    loadBloggers();
                } else {
                    let errorMsg = data.detail || data.msg || '未知错误';
                    if (typeof errorMsg === 'object') {
                        errorMsg = JSON.stringify(errorMsg);
                    }
                    lastApiError = errorMsg;
                    updateApiStatus('error', errorMsg);

                    if (errorMsg.includes('Cookie') || errorMsg.includes('登录') || errorMsg.includes('过期')) {
                        updateCookieStatus(true, false);
                        showGlobalAlert('error', 'Cookie无效或已过期', '请重新设置微博Cookie', [
                            { label: '设置Cookie', onclick: 'showCookieModal()' }
                        ], true);
                    } else {
                        showGlobalAlert('error', '爬取失败', errorMsg);
                    }
                }
            } catch (error) {
                lastApiError = error.toString();
                updateApiStatus('error', error.toString());
                showGlobalAlert('error', '爬取失败', error.toString());
            }
        }

        // 显示Cookie设置
        function showCookieModal() {
            loadCookieStatus();
            new bootstrap.Modal(document.getElementById('cookieModal')).show();
        }

        // 加载Cookie状态
        async function loadCookieStatus() {
            try {
                const response = await fetch('/api/cookie');
                const data = await response.json();
                const statusEl = document.getElementById('cookieStatus');

                if (!data.has_cookie) {
                    statusEl.textContent = '未设置';
                    statusEl.className = 'text-muted';
                } else if (data.is_valid) {
                    statusEl.textContent = '有效';
                    statusEl.className = 'text-success';
                } else {
                    statusEl.textContent = '已过期';
                    statusEl.className = 'text-danger';
                }

                document.getElementById('cookieInput').value = data.cookie || '';
            } catch (error) {
                console.error('加载Cookie状态失败:', error);
            }
        }

        // 保存Cookie
        async function saveCookie() {
            const cookie = document.getElementById('cookieInput').value;
            try {
                const response = await fetch('/api/cookie', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie })
                });
                if (response.ok) {
                    // 重新检查Cookie状态以获取有效性
                    const statusResponse = await fetch('/api/cookie');
                    const statusData = await statusResponse.json();
                    updateCookieStatus(statusData.has_cookie, statusData.is_valid);

                    if (statusData.is_valid) {
                        updateApiStatus('waiting');
                        hideGlobalAlert();
                        showGlobalAlert('success', 'Cookie保存成功', 'Cookie有效，可以开始爬取微博了');
                    } else {
                        updateApiStatus('error', 'Cookie无效');
                        showGlobalAlert('warning', 'Cookie已保存但无效', '请检查Cookie是否正确，或重新获取Cookie');
                    }
                    bootstrap.Modal.getInstance(document.getElementById('cookieModal')).hide();
                }
            } catch (error) {
                showGlobalAlert('error', '保存失败', error.toString());
            }
        }

        // 显示图片 - 旧方法保留兼容
        function showImage(src) {
            document.getElementById('modalImage').src = src;
            new bootstrap.Modal(document.getElementById('imageModal')).show();
        }

        // 图片放大模态框相关
        let currentImages = [];
        let currentIndex = 0;
        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        function openImageModal(img) {
            const container = img.closest('.weibo-images');
            if (!container) return;

            try {
                currentImages = JSON.parse(container.dataset.images || '[]');
            } catch {
                currentImages = [img.src];
            }

            currentIndex = parseInt(img.dataset.index) || 0;
            zoomLevel = 1;
            panX = 0;
            panY = 0;
            showImageModal();
        }

        function showImageModal() {
            // 创建或获取模态框
            let modal = document.getElementById('imagePreviewModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'imagePreviewModal';
                modal.className = 'image-modal';
                modal.innerHTML = `
                    <span class="close-btn" onclick="closeImageModal()">&times;</span>
                    <div class="zoom-controls">
                        <button onclick="zoomOut()" title="缩小"><i class="bi bi-dash"></i></button>
                        <span class="zoom-level" id="zoomLevel">100%</span>
                        <button onclick="zoomIn()" title="放大"><i class="bi bi-plus"></i></button>
                        <span class="divider"></span>
                        <button onclick="resetZoom()" title="重置"><i class="bi bi-arrow-counterclockwise"></i></button>
                    </div>
                    <span class="nav-btn prev-btn" onclick="prevImage()">&#10094;</span>
                    <div class="image-container">
                        <img id="previewImage" src="" alt="预览" draggable="false">
                    </div>
                    <span class="nav-btn next-btn" onclick="nextImage()">&#10095;</span>
                    <div class="img-counter"><span id="imgCounter">1/1</span></div>
                `;
                document.body.appendChild(modal);

                // 点击背景关闭
                modal.addEventListener('click', function(e) {
                    if (e.target === modal || e.target.classList.contains('image-container')) {
                        closeImageModal();
                    }
                });

                // 键盘导航
                document.addEventListener('keydown', function(e) {
                    if (!modal.classList.contains('active')) return;
                    if (e.key === 'Escape') closeImageModal();
                    if (e.key === 'ArrowLeft') prevImage();
                    if (e.key === 'ArrowRight') nextImage();
                    if (e.key === '+' || e.key === '=') zoomIn();
                    if (e.key === '-') zoomOut();
                    if (e.key === '0') resetZoom();
                });

                // 鼠标滚轮缩放
                modal.addEventListener('wheel', function(e) {
                    if (!modal.classList.contains('active')) return;
                    e.preventDefault();
                    if (e.deltaY < 0) zoomIn();
                    else zoomOut();
                });

                // 拖拽移动
                const img = modal.querySelector('#previewImage');
                img.addEventListener('mousedown', startDrag);
                document.addEventListener('mousemove', drag);
                document.addEventListener('mouseup', endDrag);
            }

            const img = document.getElementById('previewImage');
            img.src = currentImages[currentIndex];
            document.getElementById('imgCounter').textContent = `${currentIndex + 1}/${currentImages.length}`;
            updateZoomDisplay();

            // 显示/隐藏导航按钮
            modal.querySelector('.prev-btn').style.display = currentImages.length > 1 ? 'block' : 'none';
            modal.querySelector('.next-btn').style.display = currentImages.length > 1 ? 'block' : 'none';
            modal.querySelector('.img-counter').style.display = currentImages.length > 1 ? 'block' : 'none';

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            // 重置缩放
            resetZoom();
        }

        function closeImageModal() {
            const modal = document.getElementById('imagePreviewModal');
            if (modal) {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        function prevImage() {
            if (currentImages.length <= 1) return;
            currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
            document.getElementById('previewImage').src = currentImages[currentIndex];
            document.getElementById('imgCounter').textContent = `${currentIndex + 1}/${currentImages.length}`;
            resetZoom();
        }

        function nextImage() {
            if (currentImages.length <= 1) return;
            currentIndex = (currentIndex + 1) % currentImages.length;
            document.getElementById('previewImage').src = currentImages[currentIndex];
            document.getElementById('imgCounter').textContent = `${currentIndex + 1}/${currentImages.length}`;
            resetZoom();
        }

        function zoomIn() {
            if (zoomLevel < 5) {
                zoomLevel = Math.min(5, zoomLevel + 0.25);
                applyZoom();
            }
        }

        function zoomOut() {
            if (zoomLevel > 0.25) {
                zoomLevel = Math.max(0.25, zoomLevel - 0.25);
                applyZoom();
            }
        }

        function resetZoom() {
            zoomLevel = 1;
            panX = 0;
            panY = 0;
            applyZoom();
        }

        function applyZoom() {
            const img = document.getElementById('previewImage');
            if (img) {
                img.style.transform = `scale(${zoomLevel}) translate(${panX}px, ${panY}px)`;
                img.classList.toggle('zoomed', zoomLevel > 1);
            }
            updateZoomDisplay();
        }

        function updateZoomDisplay() {
            const el = document.getElementById('zoomLevel');
            if (el) {
                el.textContent = Math.round(zoomLevel * 100) + '%';
            }
        }

        function startDrag(e) {
            if (zoomLevel <= 1) return;
            isDragging = true;
            startX = e.clientX - panX * zoomLevel;
            startY = e.clientY - panY * zoomLevel;
            e.target.style.cursor = 'grabbing';
        }

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            panX = (e.clientX - startX) / zoomLevel;
            panY = (e.clientY - startY) / zoomLevel;
            applyZoom();
        }

        function endDrag(e) {
            isDragging = false;
            const img = document.getElementById('previewImage');
            if (img) {
                img.style.cursor = zoomLevel > 1 ? 'grab' : 'default';
            }
        }

    </script>
</body>
</html>
