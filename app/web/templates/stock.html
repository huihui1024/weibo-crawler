<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能选股 - 微博博主内容抓取</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #43a047;
            --secondary-color: #2e7d32;
            --bg-color: #e8f5e9;
            --card-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        body {
            background: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            box-shadow: 0 2px 10px rgba(67,160,71,0.3);
        }
        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }
        .card-header {
            background: #fff;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            padding: 16px 20px;
            border-radius: 12px 12px 0 0 !important;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header .bi {
            margin-right: 8px;
            color: var(--primary-color);
        }
        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
        }
        .btn-primary:hover {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
        }
        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
        }
        .btn-outline-primary:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        .stock-item {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #eee;
            transition: all 0.2s;
        }
        .stock-item:hover {
            border-color: var(--primary-color);
            box-shadow: 0 2px 8px rgba(67,160,71,0.15);
        }
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .stock-code {
            font-weight: 700;
            font-size: 16px;
            color: #333;
        }
        .stock-name {
            color: #666;
            margin-left: 8px;
        }
        .stock-score {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }
        .stock-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        .stock-info-item {
            text-align: center;
            padding: 8px;
            background: #f1f8e9;
            border-radius: 6px;
        }
        .stock-info-label {
            font-size: 12px;
            color: #888;
        }
        .stock-info-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .stock-info-value.up {
            color: #e74c3c;
        }
        .stock-info-value.down {
            color: #27ae60;
        }
        .stock-reasons {
            margin-top: 10px;
        }
        .stock-reasons .badge {
            margin-right: 5px;
            margin-bottom: 5px;
            font-weight: normal;
            padding: 4px 10px;
        }
        .prediction-item {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #eee;
        }
        .prediction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .prediction-status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-pending {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-reviewed {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .prediction-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        .prediction-detail-item {
            padding: 10px;
            background: #f1f8e9;
            border-radius: 8px;
        }
        .prediction-detail-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }
        .prediction-detail-value {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .review-card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #eee;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }
        .review-date {
            font-weight: 600;
            color: #333;
        }
        .review-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .review-stat {
            text-align: center;
            padding: 10px;
            background: #f1f8e9;
            border-radius: 8px;
        }
        .review-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .review-stat-label {
            font-size: 12px;
            color: #888;
        }
        .accuracy-high {
            color: #27ae60;
        }
        .accuracy-medium {
            color: #f39c12;
        }
        .accuracy-low {
            color: #e74c3c;
        }
        .review-lessons {
            background: #e8f5e9;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }
        .review-lessons h6 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        .review-lessons ul {
            margin-bottom: 0;
            padding-left: 20px;
        }
        .review-lessons li {
            margin-bottom: 4px;
            font-size: 13px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }
        .empty-state i {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 16px;
        }
        .nav-tabs {
            border-bottom: 2px solid #eee;
        }
        .nav-tabs .nav-link {
            border: none;
            color: #666;
            font-weight: 500;
            padding: 12px 20px;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .nav-tabs .nav-link:hover {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .nav-tabs .nav-link.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
            background: transparent;
        }
        .tab-content {
            padding-top: 20px;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .detail-table {
            font-size: 13px;
        }
        .detail-table th {
            background: #f1f8e9;
            font-weight: 600;
        }
        .trend-match {
            color: #27ae60;
        }
        .trend-mismatch {
            color: #e74c3c;
        }
        .date-group {
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
        }
        .date-header {
            padding-bottom: 10px;
            border-bottom: 2px solid #dee2e6;
            margin-bottom: 10px;
        }
        .date-header h5 {
            color: #495057;
        }
        .date-stats {
            font-size: 12px;
        }
        .risk-metric {
            text-align: center;
            padding: 12px;
            background: #f1f8e9;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .risk-metric-value {
            font-size: 22px;
            font-weight: 700;
        }
        .risk-metric-label {
            font-size: 12px;
            color: #888;
        }
        .risk-level-low { color: #27ae60; }
        .risk-level-medium { color: #f39c12; }
        .risk-level-high { color: #e74c3c; }
        .stress-table th { background: #f1f8e9; }
        .risk-gauge {
            width: 120px;
            height: 60px;
            border-radius: 60px 60px 0 0;
            background: linear-gradient(to right, #27ae60, #f39c12, #e74c3c);
            position: relative;
            margin: 10px auto;
        }
        .risk-gauge-arrow {
            width: 4px;
            height: 50px;
            background: #333;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform-origin: bottom center;
        }
        /* 回测引擎样式 */
        .backtest-controls {
            background: #f1f8e9;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .backtest-controls label {
            font-weight: 500;
            color: #555;
            margin-bottom: 0;
            white-space: nowrap;
        }
        .backtest-controls select, .backtest-controls input {
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 6px 10px;
            font-size: 14px;
        }
        .backtest-metric {
            text-align: center;
            padding: 14px;
            background: #f1f8e9;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .backtest-metric-value {
            font-size: 24px;
            font-weight: 700;
        }
        .backtest-metric-label {
            font-size: 12px;
            color: #888;
        }
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }
        .trade-table th { background: #f1f8e9; font-weight: 600; }
                        .trade-direction-buy { color: #e74c3c; }
        .trade-direction-sell { color: #27ae60; }
        .factor-bar { height: 6px; border-radius: 3px; background: #e0e0e0; margin-top: 4px; }
        .factor-bar-fill { height: 100%; border-radius: 3px; }
        .chain-tag { background: linear-gradient(135deg, #ff9800, #f57c00); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
        .bottleneck-tag { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .gap-tag { background: linear-gradient(135deg, #9c27b0, #7b1fa2); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
        .squeeze-tag { background: linear-gradient(135deg, #f44336, #d32f2f); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up-arrow"></i> 智能选股系统
            </a>
            <div class="d-flex align-items-center gap-3">
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house"></i> 返回首页
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <!-- 操作按钮区 -->
        <div class="card">
            <div class="card-body">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <h5 class="mb-0"><i class="bi bi-cpu"></i> 智能选股与复盘系统</h5>
                        <small class="text-muted">基于博主策略风格，结合A股市场数据筛选潜在标的</small>
                    </div>
                    <div class="col-md-4">
                        <div class="d-flex align-items-center gap-2">
                            <label class="mb-0"><i class="bi bi-person"></i> 选择博主:</label>
                            <select class="form-select form-select-sm" id="bloggerSelect" style="width: 150px;" onchange="onBloggerChange()">
                                <option value="">自动选择</option>
                            </select>
                            <span class="text-muted small" id="currentBlogger"></span>
                        </div>
                    </div>
                    <div class="col-md-4 text-end">
                        <button class="btn btn-primary me-2" onclick="refreshPool()">
                            <i class="bi bi-arrow-repeat"></i> 刷新股票池
                        </button>
                        <button class="btn btn-outline-primary" onclick="runReview()">
                            <i class="bi bi-clipboard-check"></i> 执行复盘
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 标签页 -->
        <ul class="nav nav-tabs" id="mainTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="pool-tab" data-bs-toggle="tab" data-bs-target="#pool" type="button">
                    <i class="bi bi-collection"></i> 股票池
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="predictions-tab" data-bs-toggle="tab" data-bs-target="#predictions" type="button">
                    <i class="bi bi-lightning"></i> 预测记录
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="reviews-tab" data-bs-toggle="tab" data-bs-target="#reviews" type="button">
                    <i class="bi bi-journal-check"></i> 复盘报告
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="details-tab" data-bs-toggle="tab" data-bs-target="#details" type="button">
                    <i class="bi bi-list-check"></i> 复盘详情
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="risk-tab" data-bs-toggle="tab" data-bs-target="#risk" type="button">
                    <i class="bi bi-shield-exclamation"></i> 风险报告
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="backtest-tab" data-bs-toggle="tab" data-bs-target="#backtest" type="button">
                    <i class="bi bi-graph-up-arrow"></i> 回测引擎
                </button>
            </li>
        </ul>

        <div class="tab-content" id="mainTabContent">
            <!-- 股票池 -->
            <div class="tab-pane fade show active" id="pool" role="tabpanel">
                <div id="stockPoolContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 预测记录 -->
            <div class="tab-pane fade" id="predictions" role="tabpanel">
                <div id="predictionsContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 复盘报告 -->
            <div class="tab-pane fade" id="reviews" role="tabpanel">
                <div id="reviewsContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 复盘详情 -->
            <div class="tab-pane fade" id="details" role="tabpanel">
                <div id="detailsContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 风险报告 -->
            <div class="tab-pane fade" id="risk" role="tabpanel">
                <div id="riskContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-2 text-muted">加载中...</p>
                    </div>
                </div>
                <div class="text-end mt-2">
                    <button class="btn btn-sm btn-outline-primary" onclick="generateRiskReport()">
                        <i class="bi bi-arrow-clockwise"></i> 生成最新报告
                    </button>
                </div>
            </div>

            <!-- 回测引擎 -->
            <div class="tab-pane fade" id="backtest" role="tabpanel">
                <!-- 回测控制面板 -->
                <div class="backtest-controls">
                    <label><i class="bi bi-calendar-range"></i> 回测天数:</label>
                    <select id="backtestDays">
                        <option value="7">7天</option>
                        <option value="14">14天</option>
                        <option value="30" selected>30天</option>
                        <option value="60">60天</option>
                        <option value="90">90天</option>
                        <option value="180">180天</option>
                    </select>
                    <label><i class="bi bi-gear"></i> 策略:</label>
                    <select id="backtestStrategy">
                        <option value="prediction">预测策略</option>
                        <option value="multi_factor">多因子策略</option>
                    </select>
                    <label><i class="bi bi-cash-stack"></i> 初始资金:</label>
                    <select id="backtestCapital">
                        <option value="500000">50万</option>
                        <option value="1000000" selected>100万</option>
                        <option value="2000000">200万</option>
                        <option value="5000000">500万</option>
                    </select>
                    <button class="btn btn-primary" onclick="runBacktest()">
                        <i class="bi bi-play-circle"></i> 运行回测
                    </button>
                </div>

                <!-- 回测指标卡片 -->
                <div class="row" id="backtestMetrics" style="display:none;">
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btTotalReturn">-</div>
                            <div class="backtest-metric-label">总收益率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btAnnualReturn">-</div>
                            <div class="backtest-metric-label">年化收益率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btMaxDrawdown">-</div>
                            <div class="backtest-metric-label">最大回撤</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btSharpe">-</div>
                            <div class="backtest-metric-label">夏普比率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btWinRate">-</div>
                            <div class="backtest-metric-label">胜率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btTotalTrades">-</div>
                            <div class="backtest-metric-label">总交易次数</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btFinalCapital">-</div>
                            <div class="backtest-metric-label">最终资金</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="backtest-metric">
                            <div class="backtest-metric-value" id="btProfitFactor">-</div>
                            <div class="backtest-metric-label">盈亏比</div>
                        </div>
                    </div>
                </div>

                <!-- 净值曲线 -->
                <div class="card" id="btEquityCard" style="display:none;">
                    <div class="card-header">
                        <span><i class="bi bi-graph-up"></i> 净值曲线</span>
                        <small class="text-muted" id="btEquityPeriod"></small>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="btEquityChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 回撤曲线 -->
                <div class="card" id="btDrawdownCard" style="display:none;">
                    <div class="card-header">
                        <span><i class="bi bi-arrow-down-circle"></i> 回撤曲线</span>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="btDrawdownChart"></canvas>
                        </div>
                    </div>
                </div>

                <!-- 收益分布 -->
                <div class="row" id="btDistRow" style="display:none;">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <span><i class="bi bi-bar-chart"></i> 日收益率分布</span>
                            </div>
                            <div class="card-body">
                                <div class="chart-container" style="height:250px;">
                                    <canvas id="btReturnDistChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                <span><i class="bi bi-pie-chart"></i> 策略概览</span>
                            </div>
                            <div class="card-body" id="btStrategyOverview">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 交易明细 -->
                <div class="card" id="btTradesCard" style="display:none;">
                    <div class="card-header">
                        <span><i class="bi bi-list-ul"></i> 交易明细</span>
                        <small class="text-muted" id="btTradesCount"></small>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover trade-table" id="btTradesTable">
                                <thead>
                                    <tr>
                                        <th>日期</th>
                                        <th>代码</th>
                                        <th>名称</th>
                                        <th>方向</th>
                                        <th>价格</th>
                                        <th>数量</th>
                                        <th>金额</th>
                                        <th>手续费</th>
                                        <th>原因</th>
                                    </tr>
                                </thead>
                                <tbody id="btTradesBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 空状态 -->
                <div id="btEmptyState" class="text-center py-5">
                    <i class="bi bi-graph-up-arrow" style="font-size:48px;color:#ddd;"></i>
                    <p class="text-muted mt-3">点击"运行回测"查看策略表现</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // 当前选中的博主
        let currentBloggerName = '';

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadBloggers();
            loadStockPool();
            loadPredictions();
            loadReviews();
            loadReviewDetails();
            loadRiskReport();
        });

        // 博主切换事件
        function onBloggerChange() {
            const select = document.getElementById('bloggerSelect');
            currentBloggerName = select.value;
            // 刷新所有数据
            loadStockPool();
            loadPredictions();
            loadReviews();
            loadReviewDetails();
        }

        // 加载博主列表
        async function loadBloggers() {
            try {
                const response = await fetch('/api/bloggers');
                const data = await response.json();
                const select = document.getElementById('bloggerSelect');

                // 清空现有选项（保留"自动选择"）
                select.innerHTML = '<option value="">自动选择</option>';

                // 添加博主选项
                data.bloggers.forEach(b => {
                    const option = document.createElement('option');
                    option.value = b.blogger.nickname || b.blogger.weibo_uid;
                    option.textContent = b.blogger.nickname || b.blogger.weibo_uid;
                    select.appendChild(option);
                });

                // 恢复之前选中的博主
                if (currentBloggerName) {
                    select.value = currentBloggerName;
                }
            } catch (error) {
                console.error('加载博主列表失败:', error);
            }
        }

        // 加载股票池
        async function loadStockPool() {
            const container = document.getElementById('stockPoolContent');
            try {
                // 添加博主参数
                let url = '/api/stock-pool';
                if (currentBloggerName) {
                    url += '?blogger_name=' + encodeURIComponent(currentBloggerName);
                }
                const response = await fetch(url);
                const data = await response.json();

                // 显示当前博主
                const currentBloggerEl = document.getElementById('currentBlogger');
                if (currentBloggerName) {
                    currentBloggerEl.textContent = `(基于: ${currentBloggerName})`;
                } else if (data.blogger_name) {
                    currentBloggerEl.textContent = `(基于: ${data.blogger_name})`;
                } else {
                    currentBloggerEl.textContent = '(全部博主)';
                }

                if (!data.stocks || data.stocks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <p>股票池为空</p>
                            <button class="btn btn-primary" onclick="refreshPool()">立即选股</button>
                        </div>
                    `;
                    return;
                }

                // 动态胜率横幅
                let dynBanner = '';
                if (data.dynamic_win_rate) {
                    const dwr = data.dynamic_win_rate;
                    const wr = dwr.win_rate || dwr.backtest_win_rate || 0;
                    const signal = dwr.signal_strength || 'normal';
                    const samples = dwr.total_samples || 0;
                    const dev = dwr.deviation || 0;
                    const consecLow = dwr.consecutive_low_days || 0;
                    let signalColor = 'success';
                    let signalIcon = 'check-circle';
                    let signalText = '正常';
                    if (signal === 'suspended') { signalColor = 'danger'; signalIcon = 'x-circle'; signalText = '已暂停'; }
                    else if (signal === 'degraded') { signalColor = 'warning'; signalIcon = 'exclamation-triangle'; signalText = '已降级'; }

                    dynBanner = `
                    <div class="alert alert-${signalColor} d-flex align-items-center mb-3" style="font-size:13px;">
                        <i class="bi bi-${signalIcon} me-2"></i>
                        <div>
                            <strong>实盘胜率: ${wr}%</strong>
                            ${samples > 0 ? `(近${samples}笔, ${dwr.total_correct}笔正确)` : '(无实盘数据)'}
                            <span class="badge bg-${signalColor} ms-2">${signalText}</span>
                            ${dwr.backtest_win_rate ? `<span class="text-muted ms-2">回测${dwr.backtest_win_rate}%</span>` : ''}
                            ${dev > 0 ? `<span class="text-muted ms-1">偏差${dev}%</span>` : ''}
                            ${consecLow > 0 ? `<span class="text-muted ms-1">连续${consecLow}天低胜率</span>` : ''}
                        </div>
                    </div>`;
                }

                // 风险提示横幅
                let riskBanner = '';
                if (data.risk_warning) {
                    riskBanner = `<div class="alert alert-warning py-2 mb-3" style="font-size:12px;"><i class="bi bi-shield-exclamation me-1"></i>${data.risk_warning}</div>`;
                }

                let html = dynBanner + riskBanner + '<div class="row">';
                data.stocks.forEach(stock => {
                    const changeClass = stock.change_pct >= 0 ? 'up' : 'down';
                    const changeSign = stock.change_pct >= 0 ? '+' : '';
                    const priceDisplay = stock.price && stock.price > 0 ? stock.price.toFixed(2) : '-';
                    const changeDisplay = stock.change_pct !== null && stock.change_pct !== undefined && stock.change_pct !== 0
                        ? changeSign + stock.change_pct.toFixed(2) + '%'
                        : '-';

                    // 选股来源标记
                    const sourceTag = stock.selection_source === '市场热点'
                        ? '<span class="badge bg-info me-1"><i class="bi bi-graph-up-arrow"></i> 市场热点</span>'
                        : stock.selection_source === '行业方向'
                        ? '<span class="badge bg-success me-1"><i class="bi bi-bar-chart-line"></i> 行业方向</span>'
                        : stock.selection_source === '量化确认'
                        ? '<span class="badge bg-warning text-dark me-1"><i class="bi bi-robot"></i> 量化确认</span>'
                        : stock.selection_source === '基本面驱动'
                        ? '<span class="badge bg-success me-1"><i class="bi bi-bar-chart-line"></i> 行业方向</span>'
                        : stock.selection_source === '量化策略' || stock.selection_source === '系统推荐'
                        ? '<span class="badge bg-warning text-dark me-1"><i class="bi bi-robot"></i> 量化确认</span>'
                        : '<span class="badge bg-info me-1"><i class="bi bi-graph-up-arrow"></i> 市场热点</span>';

                    // 博主推荐标记
                    const bloggerTag = stock.blogger_name
                        ? `<span class="badge bg-primary me-1"><i class="bi bi-person"></i> ${stock.blogger_name}</span>`
                        : '';

                    // 仓位权重显示
                    const weightTag = stock.position_weight > 0
                        ? `<span class="badge bg-warning text-dark me-1">${stock.position_weight}%仓位</span>`
                        : '';

                    // 产业链标签
                    const chainTag = stock.industry_chain
                        ? `<span class="chain-tag me-1"><i class="bi bi-diagram-3"></i> ${stock.industry_chain}</span>`
                        : '';

                    // 瓶颈节点标签
                    const bottleneckTag = stock.supply_chain_score >= 70
                        ? `<span class="bottleneck-tag me-1"><i class="bi bi-exclamation-diamond"></i> 瓶颈节点</span>`
                        : '';

                    // 认知差标签
                    const gapTag = stock.cognitive_gap_score >= 60
                        ? `<span class="gap-tag me-1"><i class="bi bi-eye-slash"></i> 认知差${stock.cognitive_gap_score.toFixed(0)}</span>`
                        : '';

                    // 轧空信号标签
                    const squeezeTag = stock.short_interest_ratio > 3 && stock.volume_surge_ratio > 1.5
                        ? `<span class="squeeze-tag me-1"><i class="bi bi-lightning"></i> 轧空信号</span>`
                        : '';

                    // 预测标签
                    const pred = stock.prediction;
                    let predTag = '';
                    let predInfoHtml = '';
                    if (pred && pred.expected_close_change > 0) {
                        predTag = `<span class="badge bg-danger me-1"><i class="bi bi-arrow-up-right"></i> 看涨${pred.expected_close_change.toFixed(2)}%</span>`;
                        predInfoHtml = `
                            <div class="stock-info-item">
                                <div class="stock-info-label">预测</div>
                                <div class="stock-info-value up">${pred.expected_trend} | +${pred.expected_close_change.toFixed(2)}%</div>
                            </div>
                            <div class="stock-info-item">
                                <div class="stock-info-label">振幅</div>
                                <div class="stock-info-value">${pred.expected_amplitude ? pred.expected_amplitude.toFixed(2) + '%' : '-'}</div>
                            </div>`;
                    } else if (pred) {
                        predTag = `<span class="badge bg-secondary me-1"><i class="bi bi-dash"></i> ${pred.expected_trend || '无'}</span>`;
                    }

                    // 因子得分条
                    const factorBarHtml = (stock.fundamental_score || stock.valuation_score || stock.capital_flow_score || stock.sentiment_score)
                        ? `
                        <div style="margin-top:8px;">
                            <div class="d-flex justify-content-between" style="font-size:11px;color:#888;">
                                <span>基本面</span><span>估值</span><span>资金流</span><span>情绪</span>
                            </div>
                            <div class="d-flex gap-1">
                                <div class="factor-bar flex-fill"><div class="factor-bar-fill" style="width:${Math.min(100,stock.fundamental_score||0)}%;background:#43a047;"></div></div>
                                <div class="factor-bar flex-fill"><div class="factor-bar-fill" style="width:${Math.min(100,stock.valuation_score||0)}%;background:#2196f3;"></div></div>
                                <div class="factor-bar flex-fill"><div class="factor-bar-fill" style="width:${Math.min(100,stock.capital_flow_score||0)}%;background:#ff9800;"></div></div>
                                <div class="factor-bar flex-fill"><div class="factor-bar-fill" style="width:${Math.min(100,stock.sentiment_score||0)}%;background:#9c27b0;"></div></div>
                            </div>
                        </div>`
                        : '';

                    html += `
                        <div class="col-md-6 col-lg-4">
                            <div class="stock-item">
                                <div class="stock-header">
                                    <div>
                                        <span class="stock-code">${stock.code}</span>
                                        <span class="stock-name">${stock.name}</span>
                                    </div>
                                    <span class="stock-score">${stock.style_match_score}分</span>
                                </div>
                                <div class="stock-info">
                                    <div class="stock-info-item">
                                        <div class="stock-info-label">板块</div>
                                        <div class="stock-info-value">${stock.sector || '-'}</div>
                                    </div>
                                    <div class="stock-info-item">
                                        <div class="stock-info-label">现价</div>
                                        <div class="stock-info-value">${priceDisplay}</div>
                                    </div>
                                    <div class="stock-info-item">
                                        <div class="stock-info-label">涨跌</div>
                                        <div class="stock-info-value ${changeClass}">${changeDisplay}</div>
                                    </div>
                                    ${predInfoHtml}
                                </div>
                                <div class="stock-reasons">
                                    ${bloggerTag}${sourceTag}${predTag}${weightTag}${chainTag}${bottleneckTag}${gapTag}${squeezeTag}
                                    ${stock.selection_reasons.map(r => `<span class="badge bg-light text-dark">${r}</span>`).join('')}
                                </div>
                                ${factorBarHtml}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> 加载失败: ${error.message}
                    </div>
                `;
            }
        }

        // 加载预测记录
        async function loadPredictions() {
            const container = document.getElementById('predictionsContent');
            try {
                // 添加博主参数
                let url = '/api/predictions?limit=30';
                if (currentBloggerName) {
                    url += '&blogger_name=' + encodeURIComponent(currentBloggerName);
                }
                const response = await fetch(url);
                const data = await response.json();

                if (!data.predictions || data.predictions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-calendar-x"></i>
                            <p>暂无预测记录</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                data.predictions.forEach(pred => {
                    const statusClass = pred.status === 'pending' ? 'status-pending' : 'status-reviewed';
                    const statusText = pred.status === 'pending' ? '待验证' : '已复盘';
                    const changeClass = pred.expected_change >= 0 ? 'up' : 'down';
                    const changeSign = pred.expected_change >= 0 ? '+' : '';
                    const currentPrice = pred.current_price && pred.current_price > 0 ? pred.current_price.toFixed(2) + '元' : '-';
                    const holdReturn = pred.expected_hold_return ? changeSign + pred.expected_hold_return.toFixed(2) + '%' : '-';
                    const actualChange = pred.actual_change ? (pred.actual_change >= 0 ? '+' : '') + pred.actual_change.toFixed(2) + '%' : '-';
                    const sellPrice = pred.sell_price && pred.sell_price > 0 ? pred.sell_price.toFixed(2) + '元' : '-';

                    html += `
                        <div class="prediction-item">
                            <div class="prediction-header">
                                <div>
                                    <strong>${pred.code}</strong>
                                    <span class="ms-2">${pred.name}</span>
                                    <small class="text-muted ms-2">${pred.prediction_date}</small>
                                </div>
                                <span class="prediction-status ${statusClass}">${statusText}</span>
                            </div>
                            <div class="prediction-details">
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">当前价格</div>
                                    <div class="prediction-detail-value">${currentPrice}</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">预期涨跌</div>
                                    <div class="prediction-detail-value ${changeClass}">${changeSign}${(pred.expected_change || 0).toFixed(2)}%</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">实际涨跌</div>
                                    <div class="prediction-detail-value">${actualChange}</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">预期振幅</div>
                                    <div class="prediction-detail-value">${(pred.expected_amplitude || 0).toFixed(2)}%</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">预期走势</div>
                                    <div class="prediction-detail-value">${pred.expected_trend || '-'}</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">持股周期</div>
                                    <div class="prediction-detail-value">${pred.expected_hold_days || 0}天</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">预期收益</div>
                                    <div class="prediction-detail-value ${changeClass}">${holdReturn}</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">卖点价格</div>
                                    <div class="prediction-detail-value">${sellPrice}</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">买入点位</div>
                                    <div class="prediction-detail-value" style="font-size:12px;">${pred.buy_point || '-'}</div>
                                </div>
                                <div class="prediction-detail-item">
                                    <div class="prediction-detail-label">卖出点位</div>
                                    <div class="prediction-detail-value" style="font-size:12px;">${pred.sell_point || '-'}</div>
                                </div>
                            </div>
                            ${pred.selection_reason ? `
                                <div class="mt-2">
                                    <small class="text-muted">选股原因：</small>
                                    <small>${pred.selection_reason}</small>
                                </div>
                            ` : ''}
                            ${pred.risk_warning ? `
                                <div class="mt-1">
                                    <small class="text-warning"><i class="bi bi-exclamation-triangle"></i> ${pred.risk_warning}</small>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> 加载失败: ${error.message}
                    </div>
                `;
            }
        }

        // 加载复盘报告
        async function loadReviews() {
            const container = document.getElementById('reviewsContent');
            try {
                const response = await fetch('/api/reviews?limit=10');
                const data = await response.json();

                if (!data.reviews || data.reviews.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-clipboard"></i>
                            <p>暂无复盘记录</p>
                            <button class="btn btn-outline-primary" onclick="runReview()">执行复盘</button>
                        </div>
                    `;
                    return;
                }

                let html = '';
                data.reviews.forEach(review => {
                    const accuracyClass = review.accuracy_rate >= 70 ? 'accuracy-high' :
                                         review.accuracy_rate >= 50 ? 'accuracy-medium' : 'accuracy-low';

                    html += `
                        <div class="review-card">
                            <div class="review-header">
                                <span class="review-date">
                                    <i class="bi bi-calendar3"></i> ${review.review_date}
                                </span>
                                <small class="text-muted">${review.review_time || ''}</small>
                            </div>
                            <div class="review-stats">
                                <div class="review-stat">
                                    <div class="review-stat-value">${review.total_predictions}</div>
                                    <div class="review-stat-label">预测总数</div>
                                </div>
                                <div class="review-stat">
                                    <div class="review-stat-value">${review.correct_predictions}</div>
                                    <div class="review-stat-label">预测正确</div>
                                </div>
                                <div class="review-stat">
                                    <div class="review-stat-value ${accuracyClass}">${review.accuracy_rate}%</div>
                                    <div class="review-stat-label">准确率</div>
                                </div>
                                <div class="review-stat">
                                    <div class="review-stat-value">${review.avg_prediction_score}</div>
                                    <div class="review-stat-label">平均评分</div>
                                </div>
                            </div>
                            ${review.lessons_learned && review.lessons_learned.length > 0 ? `
                                <div class="review-lessons">
                                    <h6><i class="bi bi-lightbulb"></i> 教训总结</h6>
                                    <ul>
                                        ${review.lessons_learned.map(l => `<li>${l}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                            ${review.improvement_suggestions && review.improvement_suggestions.length > 0 ? `
                                <div class="review-lessons" style="background:#f0fff0;">
                                    <h6><i class="bi bi-arrow-up-circle"></i> 改进建议</h6>
                                    <ul>
                                        ${review.improvement_suggestions.map(s => `<li>${s}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> 加载失败: ${error.message}
                    </div>
                `;
            }
        }

        // 加载复盘详情
        async function loadReviewDetails() {
            const container = document.getElementById('detailsContent');
            try {
                const response = await fetch('/api/review-details');
                const data = await response.json();

                if (!data.grouped || Object.keys(data.grouped).length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-list-ul"></i>
                            <p>暂无复盘详情</p>
                        </div>
                    `;
                    return;
                }

                // 按日期倒序排列
                const dates = Object.keys(data.grouped).sort((a, b) => b.localeCompare(a));

                let html = '';

                dates.forEach(date => {
                    const items = data.grouped[date];
                    // 计算当日统计
                    const avgScore = items.reduce((sum, d) => sum + (d.score || 0), 0) / items.length;
                    const correctCount = items.filter(d => d.trend_match).length;
                    const accuracy = (correctCount / items.length * 100).toFixed(1);

                    html += `
                        <div class="date-group mb-4">
                            <div class="date-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">
                                    <i class="bi bi-calendar3"></i> ${date}
                                </h5>
                                <div class="date-stats">
                                    <span class="badge bg-info me-2">共 ${items.length} 条</span>
                                    <span class="badge bg-success me-2">准确率 ${accuracy}%</span>
                                    <span class="badge bg-primary">平均评分 ${avgScore.toFixed(1)}</span>
                                </div>
                            </div>
                            <div class="table-responsive mt-2">
                                <table class="table table-hover detail-table">
                                    <thead>
                                        <tr>
                                            <th>代码</th>
                                            <th>名称</th>
                                            <th>预期涨跌</th>
                                            <th>实际涨跌</th>
                                            <th>差异</th>
                                            <th>预期振幅</th>
                                            <th>实际振幅</th>
                                            <th>趋势匹配</th>
                                            <th>评分</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;

                    items.forEach(d => {
                        const changeDiffClass = d.change_diff >= 0 ? 'text-danger' : 'text-success';
                        const trendClass = d.trend_match ? 'trend-match' : 'trend-mismatch';
                        const trendIcon = d.trend_match ? 'bi-check-circle-fill' : 'bi-x-circle-fill';

                        html += `
                            <tr>
                                <td><strong>${d.code}</strong></td>
                                <td>${d.name}</td>
                                <td>${d.expected_change >= 0 ? '+' : ''}${(d.expected_change || 0).toFixed(2)}%</td>
                                <td>${d.actual_change >= 0 ? '+' : ''}${(d.actual_change || 0).toFixed(2)}%</td>
                                <td class="${changeDiffClass}">${d.change_diff >= 0 ? '+' : ''}${(d.change_diff || 0).toFixed(2)}%</td>
                                <td>${(d.expected_amplitude || 0).toFixed(2)}%</td>
                                <td>${(d.actual_amplitude || 0).toFixed(2)}%</td>
                                <td class="${trendClass}"><i class="bi ${trendIcon}"></i></td>
                                <td><span class="badge bg-secondary">${d.score}</span></td>
                            </tr>
                        `;
                    });

                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> 加载失败: ${error.message}
                    </div>
                `;
            }

        // 刷新股票池
        async function refreshPool() {
            const btn = event.target.closest('button');
            const originalHtml = btn.innerHTML;
            const bloggerName = document.getElementById('bloggerSelect').value;
            btn.innerHTML = '<span class="loading"></span> 选股中...';
            btn.disabled = true;

            try {
                // 构建URL，如果有博主名称则传递
                let url = '/api/refresh-pool';
                if (bloggerName) {
                    url += '?blogger_name=' + encodeURIComponent(bloggerName);
                }

                const response = await fetch(url, { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    alert('股票池刷新成功！' + (data.message || ''));
                    loadStockPool();
                    loadPredictions();
                } else {
                    alert('刷新失败: ' + data.message);
                }
            } catch (error) {
                alert('请求失败: ' + error.message);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // 执行复盘
        async function runReview() {
            const btn = event.target.closest('button');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> 复盘中...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/run-review', { method: 'POST' });
                const data = await response.json();

                if (data.success) {

                    loadReviewDetails();
                    loadPredictions();
                } else {

        // ============ 回测引擎 ============

        let btEquityChart = null;
        let btDrawdownChart = null;
        let btReturnDistChart = null;

        // 运行回测
        async function runBacktest() {
            const days = parseInt(document.getElementById('backtestDays').value);
            const strategy = document.getElementById('backtestStrategy').value;
            const capital = parseFloat(document.getElementById('backtestCapital').value);

            // 显示加载状态
            document.getElementById('btEmptyState').innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">正在运行回测...</p>
                </div>
            `;
            document.getElementById('backtestMetrics').style.display = 'none';
            document.getElementById('btEquityCard').style.display = 'none';
            document.getElementById('btDrawdownCard').style.display = 'none';
            document.getElementById('btDistRow').style.display = 'none';
            document.getElementById('btTradesCard').style.display = 'none';

            try {
                const response = await fetch('/api/run-backtest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ days: days, initial_capital: capital, strategy: strategy })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.detail || '回测失败');
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error('回测返回异常');
                }

                renderBacktestResult(data.result);

            } catch (error) {
                document.getElementById('btEmptyState').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> 回测失败: ${error.message}
                    </div>
                `;
            }
        }

        // 渲染回测结果
        function renderBacktestResult(result) {
            // 隐藏空状态
            document.getElementById('btEmptyState').style.display = 'none';

            // 显示指标卡片
            const metricsEl = document.getElementById('backtestMetrics');
            metricsEl.style.display = '';

            const totalReturn = result.total_return;
            const annualReturn = result.annual_return;
            const maxDD = result.max_drawdown;
            const sharpe = result.sharpe_ratio;

            document.getElementById('btTotalReturn').textContent = totalReturn >= 0 ? '+' + totalReturn.toFixed(2) + '%' : totalReturn.toFixed(2) + '%';
            document.getElementById('btTotalReturn').style.color = totalReturn >= 0 ? '#e74c3c' : '#27ae60';

            document.getElementById('btAnnualReturn').textContent = annualReturn.toFixed(2) + '%';
            document.getElementById('btAnnualReturn').style.color = annualReturn >= 0 ? '#e74c3c' : '#27ae60';

            document.getElementById('btMaxDrawdown').textContent = maxDD.toFixed(2) + '%';
            document.getElementById('btMaxDrawdown').style.color = '#e74c3c';

            document.getElementById('btSharpe').textContent = sharpe.toFixed(2);

            document.getElementById('btWinRate').textContent = result.win_rate.toFixed(1) + '%';
            document.getElementById('btWinRate').style.color = result.win_rate >= 50 ? '#27ae60' : '#e74c3c';

            document.getElementById('btTotalTrades').textContent = result.total_trades;

            document.getElementById('btFinalCapital').textContent = formatMoney(result.final_capital) + '元';

            document.getElementById('btProfitFactor').textContent = result.profit_factor === Infinity ? '∞' : result.profit_factor.toFixed(2);

            // 净值曲线
            renderEquityCurve(result);

            // 回撤曲线
            renderDrawdownChart(result);

            // 收益分布
            renderReturnDistribution(result);

            // 策略概览
            renderStrategyOverview(result);

            // 交易明细
            renderTradeTable(result);
        }

        // 净值曲线
        function renderEquityCurve(result) {
            const card = document.getElementById('btEquityCard');
            card.style.display = '';
            document.getElementById('btEquityPeriod').textContent =
                `${result.start_date} ~ ${result.end_date}`;

            const equity = result.equity_curve || [];
            if (equity.length === 0) {
                document.getElementById('btEquityCard').querySelector('.card-body').innerHTML =
                    '<div class="text-center text-muted py-4">暂无净值数据</div>';
                return;
            }

            const labels = equity.map(e => e.date);
            const values = equity.map(e => e.total_value);
            const returns = equity.map(e => e.return_pct);

            if (btEquityChart) btEquityChart.destroy();

            const ctx = document.getElementById('btEquityChart').getContext('2d');
            btEquityChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '组合净值',
                        data: values,
                        borderColor: '#43a047',
                        backgroundColor: 'rgba(67,160,71,0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    return '净值: ' + formatMoney(ctx.parsed.y) + '元';
                                },
                                afterLabel: function(ctx) {
                                    const idx = ctx.dataIndex;
                                    const ret = returns[idx];
                                    return '收益率: ' + (ret >= 0 ? '+' : '') + ret + '%';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { maxTicksLimit: 10, font: { size: 11 } },
                            grid: { display: false }
                        },
                        y: {
                            ticks: {
                                callback: v => formatMoney(v) + '元',
                                font: { size: 11 }
                            }
                        }
                    }
                }
            });
        }

        // 回撤曲线
        function renderDrawdownChart(result) {
            const card = document.getElementById('btDrawdownCard');
            card.style.display = '';

            const ddSeries = result.drawdown_series || [];
            if (ddSeries.length === 0) {
                document.getElementById('btDrawdownCard').querySelector('.card-body').innerHTML =
                    '<div class="text-center text-muted py-4">暂无回撤数据</div>';
                return;
            }

            const labels = ddSeries.map(d => d.date);
            const ddValues = ddSeries.map(d => d.drawdown_pct);

            if (btDrawdownChart) btDrawdownChart.destroy();

            const ctx = document.getElementById('btDrawdownChart').getContext('2d');
            btDrawdownChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '回撤 (%)',
                        data: ddValues,
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231,76,60,0.15)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: ctx => '回撤: ' + ctx.parsed.y.toFixed(2) + '%'
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { maxTicksLimit: 10, font: { size: 11 } },
                            grid: { display: false }
                        },
                        y: {
                            ticks: {
                                callback: v => v.toFixed(1) + '%',
                                font: { size: 11 }
                            }
                        }
                    }
                }
            });

        // 收益分布直方图
        function renderReturnDistribution(result) {
            document.getElementById('btDistRow').style.display = '';

            const dailyReturns = result.daily_returns || [];
            if (dailyReturns.length === 0) {
                document.getElementById('btReturnDistChart').parentElement.innerHTML =
                    '<div class="text-center text-muted py-4">暂无收益分布数据</div>';
                return;
            }

            // 构建直方图数据
            const bins = ['<-5%', '-5~-3%', '-3~-2%', '-2~-1%', '-1~0%', '0~1%', '1~2%', '2~3%', '3~5%', '>5%'];
            const ranges = [
                (r) => r < -5, (r) => r >= -5 && r < -3, (r) => r >= -3 && r < -2,
                (r) => r >= -2 && r < -1, (r) => r >= -1 && r < 0,
                (r) => r >= 0 && r < 1, (r) => r >= 1 && r < 2,
                (r) => r >= 2 && r < 3, (r) => r >= 3 && r < 5, (r) => r >= 5
            ];
            const counts = ranges.map(fn => dailyReturns.filter(fn).length);
            const barColors = counts.map((_, i) => i < 5 ? 'rgba(231,76,60,0.7)' : 'rgba(39,174,96,0.7)');

            if (btReturnDistChart) btReturnDistChart.destroy();

            const ctx = document.getElementById('btReturnDistChart').getContext('2d');
            btReturnDistChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: bins,
                    datasets: [{
                        label: '天数',
                        data: counts,
                        backgroundColor: barColors,
                        borderColor: barColors.map(c => c.replace('0.7', '1')),
                        borderWidth: 1,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: { label: ctx => ctx.parsed.y + '天' }
                        }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 1 }
                        }
                    }
                }
            });
        }

        // 交易明细表
        function renderTradeTable(result) {
            const card = document.getElementById('btTradesCard');
            const trades = result.trades || [];
            if (trades.length === 0) {
                card.style.display = 'none';
                return;
            }
            card.style.display = '';
            document.getElementById('btTradesCount').textContent = `共 ${trades.length} 条`;

            const tbody = document.getElementById('btTradesBody');
            let html = '';
            trades.forEach(t => {
                const dirClass = t.direction === 'buy' ? 'trade-direction-buy' : 'trade-direction-sell';
                const dirText = t.direction === 'buy' ? '买入' : '卖出';
                html += `
                    <tr>
                        <td>${t.date}</td>
                        <td><strong>${t.code}</strong></td>
                        <td>${t.name}</td>
                        <td class="${dirClass}"><strong>${dirText}</strong></td>
                        <td>${t.price.toFixed(2)}</td>
                        <td>${t.shares}</td>
                        <td>${formatMoney(t.amount)}元</td>
                        <td>${t.commission.toFixed(2)}</td>
                        <td style="font-size:12px;">${t.reason}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // 格式化金额（简洁版）
        function formatMoney(val) {
            if (val === null || val === undefined) return '-';
            if (Math.abs(val) >= 1000000) return (val / 1000000).toFixed(2) + 'M';
            if (Math.abs(val) >= 10000) return (val / 10000).toFixed(2) + 'W';
            return val.toFixed(2);
        }

        // ── 风险报告 ──────────────────────

        async function loadRiskReport() {
            const container = document.getElementById('riskContent');
            try {
                let url = '/api/risk/report';
                if (currentBloggerName) {
                    url += '?blogger_name=' + encodeURIComponent(currentBloggerName);
                }
                const response = await fetch(url);
                const data = await response.json();

                if (!data.success || !data.report) {
                    container.innerHTML = `

                            </button>

            const container = document.getElementById('riskContent');
            container.innerHTML = `
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">正在生成风险报告...</p>
                </div>
            `;
            try {
                let url = '/api/risk/generate';
                if (currentBloggerName) {
                    url += '?blogger_name=' + encodeURIComponent(currentBloggerName);

                const data = await response.json();

                if (!data.success || !data.report) {
                    container.innerHTML = `
                        <div class="text-center py-4">
                            <i class="bi bi-shield-exclamation" style="font-size:48px;color:#ccc;"></i>

                    <div class="text-center py-4">

                        <p class="mt-3 text-muted">生成失败: ${e.message}</p>
                    </div>
                `;
            }

        function renderRiskReport(report, container) {
            const varInfo = report.portfolio_var || {};
            const riskLevel = varInfo.risk_level || '未知';
            const riskScore = varInfo.risk_score || report.overall_risk_score || 50;
            const levelClass = riskLevel === '低风险' ? 'risk-level-low' :
                               riskLevel === '中等风险' ? 'risk-level-medium' : 'risk-level-high';
            const gaugeAngle = Math.min(Math.max((riskScore - 0) / 100 * 90 - 90, -90), 90);

            const stressResults = report.stress_test_results || {};
            const riskContrib = report.risk_contribution || {};
            const individualRisks = report.individual_risks || {};

            let html = `
                <!-- 风险概览 -->
                <div class="row mb-4">
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value ${levelClass}">${riskLevel}</div>
                            <div class="risk-metric-label">风险等级</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-gauge">
                                <div class="risk-gauge-arrow" style="transform: rotate(${gaugeAngle}deg);"></div>
                            </div>
                            <div class="risk-metric-value">${riskScore.toFixed(0)}</div>
                            <div class="risk-metric-label">风险评分 (0-100)</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${formatMoney(report.portfolio_value)}</div>
                            <div class="risk-metric-label">组合市值</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value ${levelClass}">${(varInfo.var_value || 0).toFixed(2)}%</div>
                            <div class="risk-metric-label">VaR (${((varInfo.confidence_level || 0.95)*100).toFixed(0)}%)</div>
                        </div>
                    </div>
                </div>

                <!-- 风险指标 -->
                <div class="row mb-4">
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${formatMoney(varInfo.var_absolute || 0)}</div>
                            <div class="risk-metric-label">VaR绝对值</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value ${levelClass}">${(varInfo.cvar || 0).toFixed(2)}%</div>
                            <div class="risk-metric-label">CVaR (条件VaR)</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${(report.sharpe_ratio || 0).toFixed(2)}</div>
                            <div class="risk-metric-label">夏普比率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${(report.max_drawdown || 0).toFixed(2)}%</div>
                            <div class="risk-metric-label">最大回撤</div>
                        </div>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${(report.sortino_ratio || 0).toFixed(2)}</div>
                            <div class="risk-metric-label">索提诺比率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${(report.calmar_ratio || 0).toFixed(2)}</div>
                            <div class="risk-metric-label">卡尔玛比率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${(varInfo.mean_return || 0).toFixed(4)}</div>
                            <div class="risk-metric-label">日均收益率</div>
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-6">
                        <div class="risk-metric">
                            <div class="risk-metric-value">${(varInfo.std_return || 0).toFixed(4)}</div>
                            <div class="risk-metric-label">日收益率标准差</div>
                        </div>
                    </div>
                </div>
            `;

            // 压力测试结果
            if (Object.keys(stressResults).length > 0) {
                const pv = report.portfolio_value || 1;
                html += `
                    <h6 class="mt-4 mb-2"><i class="bi bi-bolt"></i> 压力测试</h6>
                    <table class="table table-sm stress-table">
                        <thead><tr><th>场景</th><th>预计损失(金额)</th><th>预计损失(%)</th></tr></thead>
                        <tbody>
                `;
                for (const [scenario, loss] of Object.entries(stressResults)) {
                    const lossPct = pv > 0 ? (loss / pv * 100) : 0;
                    const lossClass = lossPct < -5 ? 'risk-level-high' : lossPct < -2 ? 'risk-level-medium' : 'risk-level-low';
                    html += `<tr><td>${scenario}</td><td class="${lossClass}">${formatMoney(loss)}</td><td class="${lossClass}">${lossPct.toFixed(2)}%</td></tr>`;
                }
                html += `</tbody></table>`;
            }

            // 风险贡献
            if (Object.keys(riskContrib).length > 0) {
                html += `

                        <thead><tr><th>股票</th><th>风险贡献%</th></tr></thead>
                        <tbody>
                `;
                for (const [code, contrib] of Object.entries(riskContrib)) {
                    html += `<tr><td>${code}</td><td>${contrib.toFixed(2)}%</td></tr>`;
                }
                html += `</tbody></table>`;
            }

            // 个股VaR
            if (Object.keys(individualRisks).length > 0) {
                html += `
                    <h6 class="mt-4 mb-2"><i class="bi bi-bar-chart"></i> 个股风险详情</h6>
                    <table class="table table-sm">
                        <thead><tr><th>股票</th><th>VaR</th><th>CVaR</th><th>风险等级</th></tr></thead>
                        <tbody>
                `;
                for (const [code, risk] of Object.entries(individualRisks)) {
                    const rl = risk.risk_level || '未知';
                    const rlClass = rl === '低风险' ? 'risk-level-low' : rl === '中等风险' ? 'risk-level-medium' : 'risk-level-high';
                    html += `<tr><td>${code}</td><td>${(risk.var_value||0).toFixed(2)}%</td><td>${(risk.cvar||0).toFixed(2)}%</td><td class="${rlClass}">${rl}</td></tr>`;
                }
                html += `</tbody></table>`;
            }

            html += `<div class="text-muted mt-3"><small>计算时间: ${report.calculation_time || '-'}</small></div>`;

            container.innerHTML = html;
        }
    </script>
</body>
</html>
